networks:
  backend_network:
    external: true

services:
  nodpt-executor:
    build:
      context: ..
      dockerfile: Executor/Dockerfile
    image: nodpt-executor:latest
    container_name: nodpt-executor
    pull_policy: always

    # 🔹 Load external environment file
    env_file:
      - /home/runner_user/envs/backend.env

    # 🔹 Expose backend port 
    ports:
      - "8848:8848"

    # 🔹 Environment variables for .NET Agent Service
    environment:
      - DOTNET_ENVIRONMENT=Production

    # 🔹 Docker networks for DB, backend & frontend
    networks:
      - backend_network
    # 🔹 Auto restart on failure
    # restart: always
