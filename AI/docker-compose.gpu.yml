networks:
  backend_network:
    external: true

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped

    # NVIDIA GPU (requires NVIDIA GPU + drivers + Docker Desktop NVIDIA integration)
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [ gpu ]

    # enable all GPUs
    gpus: all

    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*

    volumes:
      - ollama_data:/root/.ollama

    ports:
      - "11434:11434"

    networks:
      - backend_network

volumes:
  ollama_data:
