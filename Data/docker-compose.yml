version: "3.9"

services:
  mariadb:
    build: .
    container_name: nodpt-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: "demo_password1234!"
      MYSQL_DATABASE: "demo_db"
      MYSQL_USER: "demo_user"
      MYSQL_PASSWORD: "demo_password1234!"
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mariadb_data:
